services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_USER=legal
      - POSTGRES_PASSWORD=legal
      - POSTGRES_DB=legal
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U legal']
      interval: 5s
      retries: 10
  localstack:
    image: localstack/localstack
    ports:
      - '4566:4566'
      - '4571:4571'
    environment:
      - SERVICES=apigateway,lambda,rds
      - DEBUG=1
volumes:
  pgdata:
