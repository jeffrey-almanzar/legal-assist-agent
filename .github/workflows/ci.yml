# Runs on every push and pull request. Nothing here calls Claude or needs secrets: the
# answer-quality eval (scripts.eval_answers) makes paid API calls and is run by hand.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt pytest httpx
      - run: pytest -q
        env:
          # The Anthropic client needs a key to construct; tests never call the API.
          ANTHROPIC_API_KEY: test

  retrieval-eval:
    name: Retrieval eval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: legal
          POSTGRES_PASSWORD: legal
          POSTGRES_DB: legal
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U legal"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://legal:legal@localhost:5432/legal
      # Inside the workspace: env values are not shell-expanded, so ~ would not work here.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/.cache/fastembed
    defaults:
      run:
        working-directory: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - run: pip install -r ../requirements.txt
      - run: python -m scripts.init_db
      - run: python -m scripts.seed
      # Fails the build if any labeled question stops reaching (or wrongly reaches) Claude.
      - run: python -m scripts.eval_retrieval

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t legal-assist-agent .

  cdk-synth:
    name: CDK synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'aws-cdk-lib>=2' 'constructs>=10'
      - run: python src/infra/app.py
        env:
          CDK_OUTDIR: cdk.out
